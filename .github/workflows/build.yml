name: SSH Debug Session

on:
  workflow_dispatch:  # manual trigger button on GitHub

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get
      - name: Setup SSH session
        uses: mxschmitt/action-tmate@v3
