name: rvcustomer
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.0.5

  # Navigation
  go_router: ^12.0.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.3

  # Authentication
  shared_preferences: ^2.2.2

  # Image handling
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0

  # Location & Maps
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.1

  # Loading & Error Handling
  fluttertoast: ^8.2.4
  shimmer: ^3.0.0

  # Image
  flutter_image_compress: ^2.1.0
  webview_flutter: ^4.13.0
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^27.1.48

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"